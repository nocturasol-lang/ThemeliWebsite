<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#252526">
  <link rel="icon" type="image/svg+xml" href="../assets/themeli-icon.svg">
  <title>Ρυθμίσεις — Themeli Admin</title>
  <style>
    @font-face { font-family: 'CF Mod Grotesk'; src: url('../assets/fonts/CFModGrotesk-RegularExpanded.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'CF Mod Grotesk'; src: url('../assets/fonts/CFModGrotesk-MedExtExp.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    @font-face { font-family: 'CF Mod Grotesk'; src: url('../assets/fonts/CFModGrotesk-BoldExtExpanded.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    :root {
      --bg: #404041; --panel: #353536; --field: #2c2c2d; --line: rgba(255,255,255,0.12);
      --text: #fff; --soft: rgba(255,255,255,0.72); --muted: rgba(255,255,255,0.68);
      --accent: #ff731e; --ok: #6ee7a0; --err: #ff9c94; --pad: clamp(20px, 5.7vw, 82px);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'CF Mod Grotesk', 'Helvetica Neue', sans-serif; font-size: 15px; line-height: 1.5; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }

    .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px var(--pad); }
    .bar-logo { display: block; width: 56px; flex-shrink: 0; }
    .bar-logo img { display: block; width: 100%; height: auto; }
    .bar-links { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-right: -12px; }
    .bar-link { padding: 9px 12px; background: none; border: 0; color: var(--soft); font: inherit; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: color 0.2s; }
    .bar-link:hover { color: var(--accent); }

    .page { width: 100%; max-width: 1040px; margin: 0 auto; padding: 56px var(--pad) 96px; }
    .page-title { margin: 0 0 56px; font-size: clamp(30px, 4vw, 44px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }

    .section { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; padding-top: 32px; border-top: 1px solid var(--line); }
    .section-title { margin: 0 0 12px; font-size: 20px; font-weight: 500; line-height: 1.25; letter-spacing: -0.01em; }
    .section-text { margin: 0; color: var(--soft); font-size: 14px; line-height: 1.65; }
    .state { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; font-size: 12px; letter-spacing: 0.04em; color: var(--muted); }
    .state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .state.is-on { color: var(--text); }
    .state.is-on::before { background: var(--accent); }

    .field-label { display: block; margin-bottom: 10px; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--soft); }
    .add-row { display: flex; gap: 8px; }
    .add-input { flex: 1; min-width: 0; height: 48px; padding: 0 16px; background: var(--field); border: 1px solid var(--line); border-radius: 4px; color: var(--text); font: inherit; transition: border-color 0.2s; }
    .add-input::placeholder { color: var(--muted); }
    .add-input:focus { border-color: var(--accent); outline: none; }
    .add-input[aria-invalid="true"] { border-color: var(--err); }
    .btn { height: 48px; padding: 0 22px; border-radius: 4px; border: 1px solid transparent; font: inherit; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s, opacity 0.2s; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary { background: var(--accent); color: #1a1a1c; }
    .btn-primary:hover:not(:disabled) { background: #ff8a42; }
    .btn-ghost { background: transparent; border-color: rgba(255,255,255,0.35); color: var(--text); }
    .btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

    .msg { min-height: 21px; margin: 8px 0 0; font-size: 13px; color: var(--muted); }
    .msg.is-ok { color: var(--ok); }
    .msg.is-err { color: var(--err); }

    .list-head { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .list-count { font-size: 12px; color: var(--muted); }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; border-bottom: 1px solid var(--line); }
    .addr { min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
    .remove { flex-shrink: 0; padding: 8px 0 8px 8px; background: none; border: 0; color: var(--soft); font: inherit; font-size: 12px; cursor: pointer; transition: color 0.2s; }
    .remove:hover { color: var(--err); }
    .empty { margin: 0; padding: 20px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    .test { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 24px; }
    .test .msg { flex: 1 1 200px; margin: 0; min-height: 0; }

    .login { max-width: 400px; margin: 0 auto; padding: 72px var(--pad) 96px; box-sizing: content-box; }
    .login h1 { margin: 0 0 32px; font-size: 32px; font-weight: 500; letter-spacing: -0.02em; }
    .login .add-input { display: block; width: 100%; margin-bottom: 20px; }
    .login .btn { width: 100%; }

    @media (max-width: 760px) {
      .page { padding-top: 32px; }
      .page-title { margin-bottom: 36px; }
      .section { grid-template-columns: minmax(0, 1fr); gap: 28px; }
    }
    @media (max-width: 460px) {
      .bar-links { gap: 0; margin-right: -8px; }
      .bar-link { padding: 9px 8px; font-size: 10px; letter-spacing: 0.04em; }
      .add-row { flex-direction: column; }
      .add-input { flex: none; width: 100%; }
      .btn { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="bar">
    <a href="./" class="bar-logo" aria-label="Πίνακας Διαχείρισης"><img src="../assets/themeli-icon.svg" alt="" width="75" height="50"></a>
    <nav class="bar-links" id="barLinks" aria-label="Διαχείριση" hidden>
      <a href="./" class="bar-link">Έργα</a>
      <a href="inquiries" class="bar-link">Αιτήματα</a>
      <button type="button" id="logoutBtn" class="bar-link">Αποσύνδεση</button>
    </nav>
  </header>

  <main class="login" id="login" hidden>
    <h1>Σύνδεση</h1>
    <form id="loginForm">
      <label class="field-label" for="email">Email</label>
      <input class="add-input" type="email" id="email" required autocomplete="username">
      <label class="field-label" for="password">Κωδικός</label>
      <input class="add-input" type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary">Σύνδεση</button>
      <p class="msg is-err" id="loginErr" role="alert"></p>
    </form>
  </main>

  <main class="page" id="settings" hidden>
    <h1 class="page-title">Ρυθμίσεις</h1>

    <section class="section" aria-labelledby="notifyTitle">
      <div>
        <h2 class="section-title" id="notifyTitle">Ειδοποιήσεις αιτημάτων</h2>
        <p class="section-text">Όταν κάποιος στέλνει μήνυμα από τη φόρμα επικοινωνίας, οι παραλήπτες λαμβάνουν το μήνυμα με email. Με «Απάντηση» απαντούν απευθείας στον αποστολέα.</p>
        <span class="state" id="notifyState" role="status"></span>
      </div>

      <div>
        <form id="addForm" novalidate>
          <label class="field-label" for="addEmail">Νέος παραλήπτης</label>
          <div class="add-row">
            <input class="add-input" type="email" id="addEmail" placeholder="onoma@themeli.gr" autocomplete="off" spellcheck="false" aria-describedby="addMsg">
            <button type="submit" class="btn btn-primary" id="addBtn">Προσθήκη</button>
          </div>
          <p class="msg" id="addMsg" role="status"></p>
        </form>

        <div class="list-head">
          <span class="field-label" style="margin:0;">Παραλήπτες</span>
          <span class="list-count" id="listCount"></span>
        </div>
        <ul class="list" id="list"></ul>
        <p class="empty" id="empty" hidden>Δεν υπάρχουν παραλήπτες. Δεν στέλνονται ειδοποιήσεις.</p>

        <div class="test">
          <button type="button" class="btn btn-ghost" id="testBtn">Αποστολή δοκιμής</button>
          <p class="msg" id="testMsg" role="status"></p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API = '/api';
    async function api(path, opts = {}) {
      const init = Object.assign({ credentials: 'same-origin' }, opts);
      if (init.body && typeof init.body !== 'string') {
        init.headers = Object.assign({ 'Content-Type': 'application/json' }, init.headers || {});
        init.body = JSON.stringify(init.body);
      }
      const res = await fetch(API + path, init);
      let json = null; try { json = await res.json(); } catch (_) {}
      if (!res.ok || !json || json.ok === false) {
        if (res.status === 401) show('login');
        throw new Error((json && json.error) || ('HTTP ' + res.status));
      }
      return json.data;
    }

    const $ = id => document.getElementById(id);
    const MAX = 20;
    let emails = [];
    let busy = false;

    function setMsg(el, text, kind) {
      el.textContent = text;
      el.className = 'msg' + (kind ? ' is-' + kind : '');
    }
    function plural(n) { return n === 1 ? '1 παραλήπτης' : n + ' παραλήπτες'; }

    function render() {
      const list = $('list');
      list.textContent = '';
      emails.forEach(addr => {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.className = 'addr';
        span.textContent = addr;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'remove';
        btn.textContent = 'Αφαίρεση';
        btn.setAttribute('aria-label', 'Αφαίρεση ' + addr);
        btn.addEventListener('click', () => removeEmail(addr));
        li.append(span, btn);
        list.append(li);
      });
      list.hidden = !emails.length;
      $('empty').hidden = !!emails.length;
      $('listCount').textContent = emails.length + ' / ' + MAX;
      $('testBtn').disabled = !emails.length;
      $('notifyState').textContent = emails.length ? 'Ενεργές · ' + plural(emails.length) : 'Ανενεργές';
      $('notifyState').classList.toggle('is-on', !!emails.length);
    }

    function setBusy(on) {
      busy = on;
      $('addBtn').disabled = on;
      document.querySelectorAll('.remove').forEach(b => { b.disabled = on; });
    }

    async function saveList(next) {
      const data = await api('/notifications.php', { method: 'PUT', body: { emails: next } });
      emails = data.emails;
      render();
    }

    $('addForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (busy) return;
      const input = $('addEmail');
      const addr = input.value.trim().toLowerCase();
      input.removeAttribute('aria-invalid');
      setMsg($('testMsg'), '');
      if (!addr || !input.checkValidity() || !addr.includes('.')) {
        input.setAttribute('aria-invalid', 'true');
        setMsg($('addMsg'), 'Συμπληρώστε ένα έγκυρο email.', 'err');
        input.focus();
        return;
      }
      if (emails.includes(addr)) {
        setMsg($('addMsg'), 'Αυτή η διεύθυνση υπάρχει ήδη.', 'err');
        input.focus();
        return;
      }
      if (emails.length >= MAX) {
        setMsg($('addMsg'), 'Το μέγιστο είναι ' + MAX + ' παραλήπτες.', 'err');
        return;
      }
      setBusy(true);
      try {
        await saveList(emails.concat(addr));
        input.value = '';
        setMsg($('addMsg'), 'Προστέθηκε: ' + addr, 'ok');
      } catch (err) {
        setMsg($('addMsg'), err.message, 'err');
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    async function removeEmail(addr) {
      if (busy) return;
      setBusy(true);
      setMsg($('testMsg'), '');
      try {
        await saveList(emails.filter(x => x !== addr));
        setMsg($('addMsg'), 'Αφαιρέθηκε: ' + addr, 'ok');
      } catch (err) {
        setMsg($('addMsg'), err.message, 'err');
      } finally {
        setBusy(false);
        $('addEmail').focus();
      }
    }

    $('testBtn').addEventListener('click', async () => {
      const btn = $('testBtn');
      btn.disabled = true;
      setMsg($('testMsg'), 'Αποστολή...');
      try {
        const data = await api('/notifications.php?action=test', { method: 'POST' });
        const failed = Object.keys(data.results).filter(k => !data.results[k]);
        if (failed.length) setMsg($('testMsg'), 'Ο διακομιστής δεν δέχτηκε: ' + failed.join(', '), 'err');
        else setMsg($('testMsg'), 'Στάλθηκε. Ελέγξτε τα εισερχόμενα και τα ανεπιθύμητα.', 'ok');
      } catch (err) {
        setMsg($('testMsg'), err.message, 'err');
      } finally {
        btn.disabled = !emails.length;
      }
    });

    function show(view) {
      const dash = view !== 'login';
      $('login').hidden = dash;
      $('settings').hidden = !dash;
      $('barLinks').hidden = !dash;
      if (dash) { loadSettings(); startIdleCheck(); }
      else { emails = []; stopIdleCheck(); }
    }

    async function loadSettings() {
      try {
        const data = await api('/notifications.php');
        emails = data.emails;
        render();
      } catch (err) { setMsg($('addMsg'), 'Σφάλμα: ' + err.message, 'err'); }
    }

    let idleTimer = null;
    function startIdleCheck() {
      stopIdleCheck();
      idleTimer = setInterval(async () => {
        try {
          const status = await api('/auth.php');
          if (!status.authenticated) {
            if (status.reason === 'displaced') {
              try { alert('Συνδέθηκε άλλος χρήστης από διαφορετική συσκευή. Η συνεδρία σας τερματίστηκε.'); } catch (_) {}
              setMsg($('loginErr'), 'Συνδέθηκε άλλος χρήστης από διαφορετική συσκευή.', 'err');
            }
            show('login');
          }
        } catch (_) { /* api() handles 401 */ }
      }, 15000);
    }
    function stopIdleCheck() { if (idleTimer) { clearInterval(idleTimer); idleTimer = null; } }

    (async () => {
      try {
        const status = await api('/auth.php');
        show(status.authenticated ? 'dash' : 'login');
      } catch (_) { show('login'); }
    })();

    $('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      setMsg($('loginErr'), '', 'err');
      try {
        await api('/auth.php', { method: 'POST', body: {
          email:    $('email').value.trim(),
          password: $('password').value,
        }});
        $('password').value = '';
        show('dash');
      } catch (err) {
        setMsg($('loginErr'), err.message === 'Invalid credentials' ? 'Λάθος email ή κωδικός.' : (err.message || 'Σφάλμα'), 'err');
      }
    });
    $('logoutBtn').addEventListener('click', async () => {
      try { await api('/auth.php?action=logout', { method: 'POST' }); } catch (_) {}
      show('login');
    });
  </script>
</body>
</html>
